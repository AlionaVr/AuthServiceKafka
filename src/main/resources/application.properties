spring.application.name=AuthService
server.port=8080
app.code-secret=some-very-secret-random-string
app.verification.code-expiration-minutes=10
security.jwt.secret=ZmFrZS1iYXNlNjQtc2VjcmV0LXN0cmluZy1mb3ItZGVtbw==
security.jwt.issuer=auth-service
security.jwt.access-ttl-minutes=15
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
topics.verification-codes=verification-code
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.add.type.headers=false
